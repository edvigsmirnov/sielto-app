name: sielto
description: "Offline-first planner for mandatory payments and shared budgets."
publish_to: 'none'

# Minor is the milestone number: 0.5.0 = M5, 0.6.0 = M6, 1.0.0 = public release
# at M11. The build number here is only for local builds; CI overrides it with
# the workflow run number so every artifact is unique and monotonic.
version: 0.6.0+1

environment:
  sdk: ^3.13.1

dependencies:
  # AES-GCM for the DEK envelopes. Argon2id (envelope B, PIN) arrives in M7.
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  # Money is Decimal end to end, stored as TEXT. Never double.
  decimal: ^3.2.6
  drift: ^2.34.3
  # Localization: JSON dictionaries read directly, no .arb conversion step.
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  # Envelope A key: Keystore / Credential Manager / libsecret.
  flutter_secure_storage: ^11.0.0
  # The device's IANA zone name, to seed a new Space's timezone. Reads
  # /etc/localtime on Linux and the Win32 API on Windows; no system packages.
  flutter_timezone: ^5.1.0
  # The only network call the app makes before M8: the holiday list, and only
  # with explicit consent (spec 5.1.1).
  http: ^1.6.0
  # Number and date formatting. Locale comes from the device, currency symbol
  # from the Space -- the two are passed to the formatter separately.
  intl: ^0.20.3
  # Annotations only. lib/domain uses it and must stay Flutter-free.
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.6
  # Device-local settings: theme, feed density, the local user id. Nothing
  # sensitive and nothing synced, so it stays outside the encrypted database.
  shared_preferences: ^2.5.3
  # Bundles SQLCipher through Dart hooks; see the `hooks` block below.
  sqlite3: ^3.5.2
  # IANA database. A Space's "today" is its own timezone's, not the device's
  # (plan section 2, invariant 7).
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.8

# Swaps the bundled SQLite for a SQLCipher build on every native target.
# Replaces sqlcipher_flutter_libs, which is end-of-life.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true

  assets:
    # One JSON per shipped locale. The pseudolocale has no file: it is derived
    # from en at load time by PseudoAssetLoader.
    - assets/translations/
    # Public holidays for twenty countries, so the base case needs no network
    # and no API at all (spec 5.1.1). One file per country.
    - assets/holidays/

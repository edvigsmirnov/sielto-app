name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  # Static gate. Platform builds depend on it, so a lint failure costs one job.
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Semantic half only; the build number comes from github.run_number.
      - name: Read version from pubspec
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)" \
            >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # lib/domain must not import Flutter; that keeps the M2 engine testable
      # under plain `dart test`. The analyzer cannot express a path-scoped
      # import ban, so it is checked here.
      - name: Domain layer stays Flutter-free
        run: |
          if [ -d lib/domain ]; then
            if grep -rn --include='*.dart' -E "^import 'package:flutter" lib/domain; then
              echo "::error::lib/domain must not import Flutter. Move the widget-facing part to lib/features or lib/core."
              exit 1
            fi
            echo "lib/domain is clean."
          else
            echo "lib/domain does not exist yet (arrives in M2)."
          fi

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

      # Separate from flutter analyze, which does not load analyzer plugins.
      # riverpod_lint is enabled in analysis_options.yaml and only runs here.
      - run: dart analyze --fatal-infos

      - run: flutter test

  # Release artifacts. Apple platforms out of scope (plan, G3).
  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    env:
      # versionName and versionCode. run_number only ever increases, which is
      # what Android requires to install one build over another.
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Google Drive sign-in accepts only the SHA-1 of this upload key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # Without the secret (a fork) the APK falls back to the debug key.
        run: |
          [ -n "$KEYSTORE_BASE64" ] || exit 0
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=sielto\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
            > android/key.properties

      - run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Name the artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "sielto-app-$BUILD_NAME+$BUILD_NUMBER.apk"

      # archive: false uploads the file as-is. The artifact takes the file's
      # name; `name` is ignored.
      - uses: actions/upload-artifact@v7
        with:
          path: sielto-app-*.apk
          archive: false
          if-no-files-found: error

  windows:
    name: Windows
    needs: analyze
    runs-on: windows-latest
    env:
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # The Google Drive desktop client secret stays out of the public source.
      - run: flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define=SIELTO_GOOGLE_DESKTOP_SECRET=$env:GOOGLE_DESKTOP_SECRET
        shell: pwsh
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "sielto-app-$env:BUILD_NAME+$env:BUILD_NUMBER-windows.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          path: sielto-app-*-windows.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: analyze
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          # libsecret is flutter_secure_storage_linux's: it keeps the envelope A
          # wrapping key in the GNOME keyring. g++ rather than libstdc++-N-dev:
          # the meta-package tracks the runner image's GCC, which a pinned N
          # does not. rpm provides rpmbuild.
          sudo apt-get install -y clang cmake ninja-build pkg-config g++ \
            libgtk-3-dev liblzma-dev libsecret-1-dev rpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: |
          flutter build linux --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=SIELTO_GOOGLE_DESKTOP_SECRET="$GOOGLE_DESKTOP_SECRET"
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}

      - name: Fetch appimagetool
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # deb, rpm, tar.gz and AppImage from the one release bundle. The script is
      # the same one used locally, so a packaging break reproduces off CI.
      - name: Package
        run: tools/package_linux.sh "$BUILD_NAME" "$BUILD_NUMBER"

      # One step per format: archive: false takes the file's own name, and that
      # only resolves unambiguously for a single file.
      - uses: actions/upload-artifact@v7
        with:
          path: build/packages/sielto-app_*_amd64.deb
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/packages/sielto-app-*.x86_64.rpm
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/packages/sielto-app-*-linux-x64.tar.gz
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/packages/sielto-app-*.AppImage
          archive: false
          if-no-files-found: error
